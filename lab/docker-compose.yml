# ShadowPortX Validation Lab
# Intentionally-exposed services (vulnerable/) + hardened counterparts (hardened/) bound to
# 127.0.0.1 so they fall inside the default authorized scope. FOR LOCAL TESTING ONLY — never
# deploy these on a reachable network.
#
#   cd lab && docker compose up -d
#   python -m shadowportx.cli scan 127.0.0.1 --ports 3000,6379,6380,8080,8081,9200,11211,27017
#
# Then re-scan after "remediation" (point at the hardened ports) to watch findings resolve.

services:
  # --- vulnerable ---
  redis-vuln:
    image: redis:6.2-alpine          # no authentication, old version (CVE intel)
    ports: ["127.0.0.1:6379:6379"]

  mongo-vuln:
    image: mongo:5
    ports: ["127.0.0.1:27017:27017"]

  memcached-vuln:
    image: memcached:1.6-alpine
    ports: ["127.0.0.1:11211:11211"]

  nginx-old:
    image: nginx:1.18.0-alpine       # old nginx -> CVE-2021-23017 correlation
    ports: ["127.0.0.1:8080:80"]

  grafana-anon:
    image: grafana/grafana:9.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:3000:3000"]

  elasticsearch-open:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    # Heavy (~1GB RAM). Comment out if constrained.

  # --- hardened (remediation targets) ---
  redis-hardened:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "labpass", "--protected-mode", "yes"]
    ports: ["127.0.0.1:6380:6379"]

  nginx-hardened:
    image: nginx:1.27-alpine
    volumes:
      - ./hardened/nginx-secure.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:80"]
