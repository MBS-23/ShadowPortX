[project]
name = "shadowportx"
version = "2.5.0"
description = "ShadowPortX 2.0 — Attack Surface Intelligence & Security Exposure Management Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ShadowPortX" }]

dependencies = [
    # --- API / web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # --- data / persistence ---
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # --- validation / config ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # --- recon / intelligence ---
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9.4",
    "cryptography>=42.0",
    "packaging>=24.0",
    # --- reporting ---
    "reportlab>=4.2",
    "jinja2>=3.1",
    # --- auth ---
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
scan = [
    # Real SYN/stealth scanning needs raw sockets (Linux root / Npcap on Windows).
    "scapy>=2.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
shadowportx = "shadowportx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadowportx"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501: line length handled by formatter. B008: FastAPI Depends() default is idiomatic.
# SIM105/SIM117: try/except-pass in network cleanup and nested socket+TLS `with` read clearer as-is.
ignore = ["E501", "B008", "SIM105", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests"]
# B104: binding 0.0.0.0 is intentional for a containerized API.
# B110/B112: best-effort try/except-pass is intentional in network probes (a failed probe
#   must not abort a scan). B501 (verify=False) is justified per-call with `# nosec`.
skips = ["B104", "B110", "B112"]
