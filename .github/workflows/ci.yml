name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint · security · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,scan]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Security static analysis (bandit)
        run: bandit -c pyproject.toml -r shadowportx -q
      - name: Dependency audit (pip-audit)
        run: pip-audit
        continue-on-error: true
      - name: Tests (pytest + coverage)
        run: pytest -q --cov=shadowportx --cov-report=term-missing

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t shadowportx-backend ./backend
      - name: Build frontend image
        run: docker build -t shadowportx-frontend ./frontend
