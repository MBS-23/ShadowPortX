# Render.com blueprint — deploy ShadowPortX free, one service, API + dashboard together.
#
# How to use (see docs/DEPLOY.md → "Free hosting"):
#   1. Push this repo to GitHub.
#   2. On render.com → New → Blueprint → connect the repo. Render reads this file.
#   3. Set SPX_ADMIN_PASSWORD when prompted, then Apply. You get a public https URL.
#
# The free web service sleeps after ~15 min idle (first request then cold-starts in ~30s)
# and uses ephemeral storage, so the default SQLite database resets on redeploy — the
# seeded admin + scope are recreated on every boot. For data that persists across
# restarts, point SPX_DATABASE_URL at a free Postgres (e.g. Neon) — see the commented var.

services:
  - type: web
    name: shadowportx
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPX_ENVIRONMENT
        value: production
      - key: SPX_DEBUG
        value: "false"
      - key: SPX_ENFORCE_SCOPE
        value: "true"
      # Strong signing key, generated by Render (required in production).
      - key: SPX_SECRET_KEY
        generateValue: true
      - key: SPX_ADMIN_EMAIL
        value: admin@shadowportx.local
      # Set your own admin password in the Render dashboard (not stored in the repo).
      - key: SPX_ADMIN_PASSWORD
        sync: false
      # Optional persistence: uncomment and set to a free Postgres URL (Neon/Render) to
      # keep users, scans and findings across restarts:
      # - key: SPX_DATABASE_URL
      #   sync: false
